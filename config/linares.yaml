# Configuration for Linares (Jaén). Run with:
#
#     PNOA_CONFIG=config/linares.yaml python pipeline/build_surfaces.py
#
# Linares is NOT in the path of totality. The eclipse reaches 97.15% obscuration here and
# the CNIG raster carries no C2/C3 contact times for it, so the pipeline reports a deep
# partial rather than inventing a totality interval. Everything else about the problem is
# the same as Zaragoza: the sun is 6.07 degrees up at azimuth 284.16, low enough that a
# single tree or a two-storey wall decides whether you see anything.

city:
  slug: "linares"
  name: "Linares"

crs: "EPSG:25830"          # ETRS89 / UTM zone 30N, same zone as Zaragoza (H30 tiles)
resolution_m: 1.0

# PNOA 2024 Andalucía delivery, NPC01. Different survey year and product code from the
# Aragón tiles, which is why the tile-name pattern lives in config: Zaragoza's pattern
# matches none of these files.
laz:
  glob: "new_linares/PNOA_2024_AND_*_H30_NPC01.laz"
  tile_name_regex: "PNOA_2024_AND_(\\d+)-(\\d+)_H30_NPC01\\.laz$"
  acquisition_year: 2024
  classes:
    unclassified: [1]
    ground: [2]
    vegetation_low: [3]
    vegetation_medium: [4]
    vegetation_high: [5]
    building: [6]
    low_point_noise: [7]
    bridge: [17]
    overlap: [12]

# No local orthophoto tiles for Linares. The viewer reads imagery live from the IGN WMTS,
# which covers the block; `package_tiles.py --with-rgb` is the only thing that would need
# these files, and it is not used here.
orthophoto:
  files: []
  mosaic_date: "unknown"
  note: >
    Imagery is served live by the IGN rather than built into local tiles, so no
    orthophoto files are staged for this city.

eclipse:
  date: "2026-08-12"
  raster: "10bands_2026_3857_COG.tiff"
  timezone_local: "Europe/Madrid"   # UTC+2 (CEST) on 2026-08-12
  band_meaning:
    1: "solar_elevation_deg_at_maximum"
    2: "solar_azimuth_deg_at_maximum"
    3: "inside_totality_path_flag"
    4: "unconfirmed_auxiliary_value"
    5: "unconfirmed_auxiliary_value"
    6: "c1_partial_begin_utc_decimal_hour"
    7: "maximum_eclipse_utc_decimal_hour"
    8: "c4_partial_end_utc_decimal_hour"
    9: "c2_totality_begin_utc_decimal_hour"
    10: "c3_totality_end_utc_decimal_hour"
  band_confidence: >
    Bands 9 and 10 are -1000 here, the raster's nodata value, because Linares lies
    outside the path of totality and has no C2 or C3 contact. Band 3, labelled as a
    flag, is really a continuous obscuration fraction and reads 0.9715.

observer:
  eye_height_m: 1.70
  eye_height_range_m: [1.2, 2.0]

visibility:
  effective_elevation_offsets_deg: [0.0, 0.5, 1.0, 2.0]
  clearance_classes:
    - {min: -999, max: 0.0, label: "blocked"}
    - {min: 0.0, max: 0.5, label: "fragile"}
    - {min: 0.5, max: 1.0, label: "acceptable"}
    - {min: 1.0, max: 2.0, label: "good"}
    - {min: 2.0, max: 999, label: "excellent"}
  conservative_model:
    vegetation_dilation_cells: 2
    vegetation_height_bonus_m: 1.0
    building_dilation_cells: 1
  max_ray_search_m: 600

zones:
  min_area_m2: 750
  max_area_m2: 200000
  morphology_opening_iterations: 1
  min_clearance_class: "acceptable"

  # Linares is a much smaller town than Zaragoza, so the same 8% built-density threshold
  # admits proportionally less of the block as "urban". That is the intended behaviour:
  # the unverified-access tier picks up the open ground around it, tagged as unverified.
  urban_context_radius_m: 250
  min_built_fraction: 0.08

  water_max_point_density: 2.5
  water_buffer_m: 8
  min_point_density: 3.0
  min_usable_width_m: 6

  require_osm_public_space: true
  osm_positive_buffer_m: 15
  include_parking: true

paths:
  data_output: "data/output/linares"
  data_intermediate: "data/intermediate/linares"
  viewer_public_data: "viewer/public/data/linares"
